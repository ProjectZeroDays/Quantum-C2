name: quantum-cli
version: '4.6.5'
summary: QUANTUM CLI - Authorized C2 / penetration framework
license: MIT
base: core22
grade: stable
confinement: classic  # Required for network recon / camera sweep / raw socket access
parts:
  quantum-cli:
    plugin: python
    python-packages:
      - flask
      - requests
      - waitress
      - pycryptodome
      - impacket
      - pysmb
      - colorama
    source: .
    build-packages:
      - python3-pip
      - python3-dev
      - libffi-dev
    override-build: |
      python3 -m pip install --user . || true
      cp quantum_cli.py $SNAPCRAFT_PART_INSTALL/bin/
    stage-packages:
      - python3
      - python3-flask
      - python3-requests
apps:
  quantum-cli:
    command: bin/quantum-cli
    plugs:
      - network
      - network-bind
      - home
    environment:
      PYTHONPATH: $SNAP/lib/python3.10/site-packages:$SNAP/usr/lib/python3/dist-packages
