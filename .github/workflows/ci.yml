name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flask requests waitress pycryptodome cryptography colorama impacket pysmb pytest
      - name: Smoke — launcher imports
        run: python -c "import quantum_cli; assert len(quantum_cli.ZERO_DAY_REGISTRY) >= 25"
      - name: Full pytest suite (dirtypipe live on Linux)
        run: python -m pytest tests/ -q
      - name: Faceoff — no-AI autonomy
        run: |
          python quantum_cli.py --no-ai --cycles 3 --camera-only --scope 127.0.0.0/29
          test -f logs/mitre_map.json
          test "$(wc -l < logs/decisions.jsonl)" = "3"
      - name: Faceoff — carpet bomb
        run: timeout 60 python quantum_cli.py camwar -c 127.0.0.0/29
      - name: Faceoff — kernel PoCs compile
        run: |
          cc --version && make -C weapons/poc all
