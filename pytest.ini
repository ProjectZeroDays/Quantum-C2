[pytest]
testpaths = 
    agents
    tests
    src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -q
    --no-header
    -p no:cacheprovider
pythonpath = agents/specialized
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning